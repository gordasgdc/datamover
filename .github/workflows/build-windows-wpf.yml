name: Build DataMover WPF (Windows nou, .NET/Wpf.Ui)

# Client Windows nou (windows-native/), separat de clientul Python vechi
# (build-windows.yml) - cei doi coexista pana la validarea completa a
# celui nou (vezi CLAUDE.md). Ruleaza doar cand se schimba ceva in
# windows-native/, ca sa nu dubleze CI-ul la fiecare push care nu-l
# atinge.
on:
  push:
    branches: [ main ]
    paths:
      - 'windows-native/**'
      - '.github/workflows/build-windows-wpf.yml'
  workflow_dispatch: {}

jobs:
  build-windows-wpf:
    runs-on: windows-latest
    # [CLAUDE.md Regula 34] `secrets` nu e permis direct intr-un `if:` de
    # pas (confirmat cu actionlint) - valoarea trece printr-un `env:` la
    # nivel de JOB (aici `secrets` E permis), pasii citesc
    # `env.HAS_WIN_SELFSIGN` (context permis in `if:`).
    env:
      HAS_WIN_SELFSIGN: ${{ secrets.WIN_SELFSIGN_PFX_BASE64 != '' }}

    steps:
      - name: Descarca codul din repo
        uses: actions/checkout@v4

      - name: Instaleaza .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Publica clientul WPF (self-contained, win-x64)
        run: |
          dotnet publish windows-native/DataMover.Client/DataMover.Client.csproj `
            -c Release -r win-x64 --self-contained true `
            -p:PublishSingleFile=false `
            -o windows-native/publish

      # [CLAUDE.md Regula 34, 2026-09-06] Semnare Self-Signed, DOAR pentru
      # testare interna/cerc restrans (NU elimina SmartScreen pentru
      # publicul larg - vezi mac-native/codesigning/README-windows.md).
      # Ruleaza DOAR daca secretele exista - altfel build-ul continua
      # NESEMNAT, exact ca inainte, fara nicio eroare.
      - name: Semneaza DataMover.Client.exe (Self-Signed, test intern)
        if: ${{ env.HAS_WIN_SELFSIGN == 'true' }}
        shell: pwsh
        env:
          WIN_SELFSIGN_PFX_BASE64: ${{ secrets.WIN_SELFSIGN_PFX_BASE64 }}
          WIN_SELFSIGN_PFX_PASSWORD: ${{ secrets.WIN_SELFSIGN_PFX_PASSWORD }}
        run: .\mac-native\codesigning\sign-windows.ps1 -TargetPath "windows-native\publish\DataMover.Client.exe"

      - name: Compileaza instalatorul (Inno Setup - preinstalat pe windows-latest)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" windows-native\installer.iss

      - name: Semneaza installer-ul final (Self-Signed, test intern)
        if: ${{ env.HAS_WIN_SELFSIGN == 'true' }}
        shell: pwsh
        env:
          WIN_SELFSIGN_PFX_BASE64: ${{ secrets.WIN_SELFSIGN_PFX_BASE64 }}
          WIN_SELFSIGN_PFX_PASSWORD: ${{ secrets.WIN_SELFSIGN_PFX_PASSWORD }}
        run: .\mac-native\codesigning\sign-windows.ps1 -TargetPath "windows-native\Output\DataMoverSetup.exe"

      - name: Arhiveaza instalatorul intr-un .zip
        run: |
          mkdir windows-native\dist_final
          copy "windows-native\Output\DataMoverSetup.exe" windows-native\dist_final\
          Compress-Archive -Path "windows-native\dist_final\*" -DestinationPath "windows-native\DataMover-WPF-Windows.zip"

      - name: Incarca .zip ca artefact descarcabil
        uses: actions/upload-artifact@v4
        with:
          retention-days: 7
          name: DataMover-WPF-Windows
          path: windows-native/DataMover-WPF-Windows.zip
