name: Release DataMover (Mac + Windows)

# Se ruleaza automat cand creezi un "tag" de versiune, de exemplu:
#   git tag v1.0.0
#   git push origin v1.0.0
# Sau manual din tab-ul "Actions" -> "Run workflow" (introduci tag-ul dorit).
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag pentru release (ex: v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Descarca codul din repo
        uses: actions/checkout@v4

      - name: Instaleaza Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instaleaza dependintele
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller reportlab tkinterdnd2 plyer pystray pillow cryptography

      - name: Compileaza .exe cu PyInstaller
        run: |
          pyinstaller --onefile --windowed --name "DataMover" `
            --icon=DataMover.ico `
            --hidden-import=offload_engine `
            --hidden-import=pdf_report `
            --hidden-import=config `
            --hidden-import=theme `
            --hidden-import=tooltip `
            --hidden-import=checkpoint `
            --hidden-import=update_config `
            --hidden-import=updater `
            --hidden-import=translations `
            --hidden-import=license_core `
            --hidden-import=license_validator `
            --hidden-import=machine_id `
            --hidden-import=activation `
            --collect-all reportlab `
            --collect-all tkinterdnd2 `
            --collect-all cryptography `
            main.py

      - name: Compileaza modulul de Monitorizare (executabil insotitor)
        run: |
          pyinstaller --onefile --windowed --name "DataMover Monitor" `
            --icon=DataMover.ico `
            --hidden-import=offload_engine `
            --hidden-import=config `
            --collect-all pystray `
            --collect-all PIL `
            tray_monitor.py

      - name: Pregateste folderul de distributie (exe + monitor + ghiduri PDF, la un loc)
        run: |
          mkdir dist_release
          copy "dist\DataMover.exe" dist_release\
          copy "dist\DataMover Monitor.exe" dist_release\
          copy "docs\guides\*.pdf" dist_release\

      - name: Arhiveaza intr-un singur .zip
        run: Compress-Archive -Path "dist_release\*" -DestinationPath "DataMover-Windows.zip"

      - name: Salveaza pentru pasul de release
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: DataMover-Windows.zip

  build-mac:
    runs-on: macos-latest
    steps:
      - name: Descarca codul din repo
        uses: actions/checkout@v4

      - name: Compileaza .app nativ (SwiftUI) si semneaza ad-hoc
        run: |
          cd mac-native
          ./build_app.sh

      - name: Creeaza arhiva pentru utilizatori (.app + ghidurile PDF in 3 limbi, la un loc)
        run: |
          mkdir -p mac_bundle
          cp -R "mac-native/dist/DataMover.app" mac_bundle/
          cp docs/guides/*.pdf mac_bundle/
          cd mac_bundle
          ditto -c -k --sequesterRsrc --keepParent "DataMover.app" "$GITHUB_WORKSPACE/DataMover-Mac.zip"
          zip -j "$GITHUB_WORKSPACE/DataMover-Mac.zip" ../docs/guides/*.pdf

      - name: Salveaza arhiva pentru pasul de release
        uses: actions/upload-artifact@v4
        with:
          name: mac-build
          path: DataMover-Mac.zip

  create-release:
    needs: [build-windows, build-mac]
    runs-on: ubuntu-latest
    steps:
      - name: Descarca fisierul Windows compilat
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: release-files

      - name: Descarca fisierul Mac compilat (.zip)
        uses: actions/download-artifact@v4
        with:
          name: mac-build
          path: release-files

      - name: Creeaza Release-ul pe GitHub, cu fisierele atasate
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: release-files/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
