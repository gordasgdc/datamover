name: Release (dezactivat)

# DataMover 2.18.1 și versiunile următoare se construiesc și se publică dintr-un depozit privat.
# Acest workflow e INERT intenționat: nu poate construi și nu poate publica nimic.
# (Înainte, un push de tag v*.*.* construia și publica automat un release din sursa acestui depozit.)
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  inactiv:
    runs-on: ubuntu-latest
    steps:
      - name: Niciun release din acest depozit
        run: echo "Release-urile se publică manual din sursa privată. Nimic de făcut aici."
