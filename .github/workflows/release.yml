name: Release DataMover (Mac + Windows)

# Se ruleaza automat cand creezi un "tag" de versiune, de exemplu:
#   git tag v1.0.0
#   git push origin v1.0.0
# Sau manual din tab-ul "Actions" -> "Run workflow" (introduci tag-ul dorit).
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag pentru release (ex: v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Descarca codul din repo
        uses: actions/checkout@v4

      - name: Instaleaza Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instaleaza dependintele
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller reportlab tkinterdnd2 plyer pystray pillow cryptography pypdf

      - name: Compileaza .exe cu PyInstaller
        run: |
          pyinstaller --onefile --windowed --name "DataMover" `
            --icon=DataMover.ico `
            --hidden-import=offload_engine `
            --hidden-import=pdf_report `
            --hidden-import=config `
            --hidden-import=theme `
            --hidden-import=tooltip `
            --hidden-import=checkpoint `
            --hidden-import=update_config `
            --hidden-import=updater `
            --hidden-import=translations `
            --hidden-import=license_core `
            --hidden-import=license_validator `
            --hidden-import=machine_id `
            --hidden-import=activation `
            --collect-all reportlab `
            --collect-all tkinterdnd2 `
            --collect-all cryptography `
            main.py

      - name: Compileaza modulul de Monitorizare (executabil insotitor)
        run: |
          pyinstaller --onefile --windowed --name "DataMover Monitor" `
            --icon=DataMover.ico `
            --hidden-import=offload_engine `
            --hidden-import=config `
            --collect-all pystray `
            --collect-all PIL `
            tray_monitor.py

      - name: Pregateste folderul de distributie (exe + monitor, la un loc, pt. installer.iss)
        run: |
          mkdir dist_release
          copy "dist\DataMover.exe" dist_release\
          copy "dist\DataMover Monitor.exe" dist_release\

      - name: Compileaza instalatorul (Inno Setup - preinstalat pe runner-ul windows-latest)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Uneste ghidurile RO/EN/ES intr-un singur PDF
        # AUDIT 2026-08-26 (CLAUDE.md Partea 1, Regula 8): arhiva Windows
        # avea 3 fisiere PDF separate (RO/EN/ES) - unificat intr-unul
        # singur, acelasi tipar ca varianta Mac (mac-native/build_installer.sh)
        # si gdc-production-manager.
        run: |
          python -c "
          from pypdf import PdfWriter
          w = PdfWriter()
          for f in ['docs/guides/DataMover_Ghid_RO.pdf', 'docs/guides/DataMover_Guide_EN.pdf', 'docs/guides/DataMover_Guia_ES.pdf']:
              w.append(f)
          w.write('Ghid-de-Utilizare.pdf')
          "

      - name: Arhiveaza instalatorul + ghidul PDF intr-un singur .zip
        run: |
          mkdir dist_final
          copy "Output\DataMoverSetup.exe" dist_final\
          copy "Ghid-de-Utilizare.pdf" dist_final\
          Compress-Archive -Path "dist_final\*" -DestinationPath "DataMover-Windows.zip"

      - name: Salveaza pentru pasul de release
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: DataMover-Windows.zip

  # NOTA (2026-08-25): job-ul "build-mac" a fost ELIMINAT — semna ad-hoc
  # (`codesign --sign -`, `TeamIdentifier=not set`), zero certificare
  # Apple reala, si folosea un launcher cu `xattr -dr com.apple.quarantine`
  # ca sa treaca de Gatekeeper. Mac-ul se compileaza acum LOCAL, cu
  # `mac-native/build_installer.sh` (semnat cu Developer ID Application +
  # Installer, notarizat, stapled — identic cu gdc-plugin-manager si
  # cursorpro-gdc), pentru ca certificatul e deja configurat in Keychain-ul
  # local, nu in secretele acestui repo CI. Fluxul de release e acum:
  # 1. Ruleaza local `cd mac-native && ./build_installer.sh`.
  # 2. Ruleaza acest workflow (push de tag) pentru artefactul Windows.
  # 3. `gh release create` cu ambele artefacte (pkg+zip Mac local +
  #    zip Windows descarcat din acest workflow) — vezi CLAUDE.md.
  create-release:
    needs: [build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Descarca fisierul Windows compilat
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: release-files

      - name: Creeaza Release-ul pe GitHub (Windows) — Mac se ataseaza manual, local
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: release-files/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
