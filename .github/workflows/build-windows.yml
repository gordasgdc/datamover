name: Build DataMover (Windows .exe)

# Se ruleaza automat cand faci "git push" pe branch-ul main,
# sau manual din tab-ul "Actions" al repo-ului (butonul "Run workflow").
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Descarca codul din repo
        uses: actions/checkout@v4

      - name: Instaleaza Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instaleaza dependintele
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller reportlab tkinterdnd2 plyer pystray pillow cryptography

      - name: Compileaza .exe cu PyInstaller
        run: |
          pyinstaller --onefile --windowed --name "DataMover" `
            --icon=DataMover.ico `
            --hidden-import=offload_engine `
            --hidden-import=pdf_report `
            --hidden-import=config `
            --hidden-import=theme `
            --hidden-import=tooltip `
            --hidden-import=checkpoint `
            --hidden-import=update_config `
            --hidden-import=updater `
            --hidden-import=translations `
            --hidden-import=license_core `
            --hidden-import=license_validator `
            --hidden-import=machine_id `
            --hidden-import=activation `
            --collect-all reportlab `
            --collect-all tkinterdnd2 `
            --collect-all cryptography `
            main.py

      - name: Compileaza modulul de Monitorizare (executabil insotitor)
        run: |
          pyinstaller --onefile --windowed --name "DataMover Monitor" `
            --icon=DataMover.ico `
            --hidden-import=offload_engine `
            --hidden-import=config `
            --collect-all pystray `
            --collect-all PIL `
            tray_monitor.py

      - name: Pregateste folderul de distributie (exe + monitor, la un loc)
        run: |
          mkdir dist_release
          copy "dist\DataMover.exe" dist_release\
          copy "dist\DataMover Monitor.exe" dist_release\

      - name: Compileaza instalatorul (Inno Setup - preinstalat pe runner-ul windows-latest)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Arhiveaza instalatorul + ghidurile PDF intr-un singur .zip
        run: |
          mkdir dist_final
          copy "Output\DataMoverSetup.exe" dist_final\
          copy "docs\guides\*.pdf" dist_final\
          Compress-Archive -Path "dist_final\*" -DestinationPath "dist\DataMover-Windows.zip"

      - name: Incarca .zip ca artefact descarcabil
        uses: actions/upload-artifact@v4
        with:
          name: DataMover-Windows
          path: dist/DataMover-Windows.zip
