name: Build DataMover (Mac .app)

# Se ruleaza automat cand faci "git push" pe branch-ul main,
# sau manual din tab-ul "Actions" al repo-ului (butonul "Run workflow").
# Doar un build de verificare (smoke test) al UI-ului nativ macOS (SwiftUI) —
# pentru versiunea publicata cu binar atasat, vezi release.yml (declansat de
# un tag v*.*.*).
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Descarca codul din repo
        uses: actions/checkout@v4

      - name: Compileaza .app nativ (SwiftUI) si semneaza ad-hoc
        run: |
          cd mac-native
          ./build_app.sh

      - name: Incarca .app ca artefact descarcabil (verificare CI)
        uses: actions/upload-artifact@v4
        with:
          name: DataMover-Mac
          path: mac-native/dist/DataMover.app
