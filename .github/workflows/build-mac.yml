name: Build DataMover (Mac .app)

# Se ruleaza automat cand faci "git push" pe branch-ul main,
# sau manual din tab-ul "Actions" al repo-ului (butonul "Run workflow").
on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build-mac:
    runs-on: macos-latest

    steps:
      - name: Descarca codul din repo
        uses: actions/checkout@v4

      - name: Instaleaza Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instaleaza dependintele
        run: |
          python -m pip install --upgrade pip
          pip install py2app pyinstaller reportlab tkinterdnd2 plyer pystray pillow

      - name: Compileaza .app cu py2app
        run: python setup.py py2app

      - name: Compileaza modulul de Monitorizare (executabil insotitor)
        run: pyinstaller --onefile --name "DataMover Monitor" tray_monitor.py

      - name: Pregateste folderul de distributie (app + monitor, la un loc)
        run: |
          mkdir -p dist_release
          cp -R "dist/DataMover.app" dist_release/
          cp "dist/DataMover Monitor" dist_release/
          chmod +x "dist_release/DataMover Monitor"

      - name: Arhiveaza (ditto pastreaza corect permisiunile Mac)
        run: |
          cd dist_release
          ditto -c -k --sequesterRsrc "." "../dist/DataMover-Mac.zip"

      - name: Incarca .zip ca artefact descarcabil
        uses: actions/upload-artifact@v4
        with:
          name: DataMover-Mac
          path: dist/DataMover-Mac.zip
