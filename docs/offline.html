<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0d0f">
<title>DataMover — Esti offline</title>
<!-- Pagina afisata de service worker (docs/sw.js) cand nu exista retea SI
     pagina ceruta nu e in cache. Deliberat fara fonturi externe: trebuie sa
     arate corect chiar si cand nimic nu se poate descarca. -->
<style>
  :root { --bg:#0a0d0f; --ink:#e7ece9; --ink-dim:#889290; --accent:#4fd18b; --line:#212a2d; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    background:var(--bg); color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:32px; text-align:center; line-height:1.5;
  }
  .card { max-width:420px; }
  img { width:88px; height:88px; margin-bottom:24px; opacity:.9; }
  h1 { font-size:22px; font-weight:600; margin-bottom:10px; }
  p { color:var(--ink-dim); font-size:15px; margin-bottom:24px; }
  button {
    background:transparent; color:var(--accent); border:1px solid var(--line);
    padding:12px 22px; border-radius:8px; font-size:15px; cursor:pointer;
    font-family:inherit;
  }
  button:active { background:var(--line); }
</style>
</head>
<body>
  <div class="card">
    <img src="icons/icon-192.png" alt="DataMover">
    <h1>Esti offline</h1>
    <p>Nu am putut incarca pagina. Continutul deja vizitat ramane disponibil; restul apare cand revine conexiunea.</p>
    <button onclick="location.reload()">Incearca din nou</button>
  </div>
  <script>
    // Reincarca automat in momentul in care sistemul anunta ca a revenit reteaua.
    window.addEventListener('online', () => location.reload());
  </script>
</body>
</html>
